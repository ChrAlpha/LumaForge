name: Publish

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated package names to publish, in dependency order.'
        required: false
        default: '@lumaforge/luma-color-runtime,@lumaforge/luma-jpeg-runtime,@lumaforge/luma-raw-runtime,@lumaforge/render-engine,@lumaforge/lmfg-cli'
        type: string
      dist_tag:
        description: 'npm dist-tag to publish under.'
        required: false
        default: 'latest'
        type: string
      dry_run:
        description: 'Run the publish steps with --dry-run (no upload).'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Configure pnpm store
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare prebuilt native assets
        run: LUMAFORGE_NATIVE_RUNTIME_MODE=prebuilt pnpm native:prepare

      - name: Cache public RAW fixtures
        uses: actions/cache@v4
        with:
          path: packages/luma-raw-runtime/fixtures/.cache/public
          key: ${{ runner.os }}-raw-fixtures-${{ hashFiles('packages/luma-raw-runtime/fixtures/public.lock.json') }}

      - name: Fetch public RAW smoke fixture
        env:
          LUMAFORGE_FIXTURE_MIRROR: ${{ vars.LUMAFORGE_FIXTURE_MIRROR }}
        run: pnpm --filter @lumaforge/luma-raw-runtime fixtures:fetch-public

      - name: Build packages
        run: pnpm cli:build

      - name: Test runtime packages
        run: pnpm test:runtime

      - name: Test lmfg CLI
        env:
          LMFG_REQUIRE_FIXTURE: '1'
        run: pnpm test:cli

      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          PACKAGES: ${{ inputs.packages }}
          DIST_TAG: ${{ inputs.dist_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          IFS=',' read -ra packages <<< "$PACKAGES"
          for package in "${packages[@]}"; do
            package="$(echo "$package" | xargs)"
            if [ -z "$package" ]; then
              continue
            fi
            args=(publish --access public --no-git-checks --tag "$DIST_TAG")
            if [ "$DRY_RUN" = "true" ]; then
              args+=(--dry-run)
            fi
            echo "::group::$package"
            pnpm --filter "$package" "${args[@]}"
            echo "::endgroup::"
          done
